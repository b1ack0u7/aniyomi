name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR checks
    runs-on: ubuntu-latest

    steps:
      - name: Validate release PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != dev || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Release PRs into main must come from this repository's dev branch."
            exit 1
          fi

      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Test APK alignment checker
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_check_16kb_alignment.py' -v
